# ELLIGBLE reference reverse proxy (OPS-003) for nginx 1.24 or later.
# Place in the http context (for example /etc/nginx/conf.d/elligble.conf), replace
# elligble.example.sch.id and the certificate paths, and point the upstream at the
# elligble container. TLS ends here; the container speaks plain HTTP on the private side.
# Runbook: docs/production/OPERATIONS_RUNBOOK.md, section 1.
# Never proxy the internal metrics port (SA_METRICS_PORT).

upstream elligble_runtime {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Access log without query strings (they carry attempt ids), with the request id the runtime
# logs too, so a problem report can be followed from the proxy into the runtime.
log_format elligble '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time $request_id';

# Per-address limits (D04.9-42). A whole school usually reaches the internet through one
# address, so these limits only stop floods and never a legitimate storm: 1 000 students
# behind one address send about 170 requests a second while answering (saves and state
# checks) and far more for a moment when they reconnect or submit together, which the
# burst absorbs. Size `rate` of elligble_api at about 0.3 x the largest number of students
# behind one address. Sign-in keeps its own, tighter zone; the runtime also limits failed
# sign-ins per account (DEC-041). Refusals are 429, which the exam client retries.
limit_req_zone $binary_remote_addr zone=elligble_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=elligble_api:20m rate=300r/s;
limit_req_status 429;
limit_req_log_level warn;

# Requests for any other name are closed without an answer.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name elligble.example.sch.id;
    access_log /var/log/nginx/elligble.access.log elligble;

    # Certificate renewal (ACME http-01); everything else moves to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.25.1 and later prefer "listen 443 ssl;" with "http2 on;".
    listen 443 ssl http2;
    server_name elligble.example.sch.id;

    ssl_certificate /etc/ssl/elligble/fullchain.pem;
    ssl_certificate_key /etc/ssl/elligble/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:elligble_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/elligble.access.log elligble;

    # One HSTS header on every answer, including the proxy's own error pages.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The runtime refuses JSON bodies over 64 KB; refuse them before they travel.
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # The runtime checks the Origin of state-changing requests against this Host.
    proxy_set_header Host $http_host;
    # Reused by the runtime and echoed back, so proxy and runtime logs correlate.
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /api/v1/auth/login {
        limit_req zone=elligble_auth burst=200 nodelay;
        proxy_pass http://elligble_runtime;
    }

    location = /api/v1/auth/activate {
        limit_req zone=elligble_auth burst=200 nodelay;
        proxy_pass http://elligble_runtime;
    }

    location /api/ {
        limit_req zone=elligble_api burst=2000 nodelay;
        proxy_pass http://elligble_runtime;
    }

    # The web client, its hashed assets and the health endpoints.
    location / {
        proxy_pass http://elligble_runtime;
    }
}
